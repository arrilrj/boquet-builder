<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bouquet Builder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700&family=Caveat:wght@600&display=swap">
<style>
:root{--bg:#fff;--panel:#fff;--ink:#4a2e25;--soft:#8c6f5f;--line:#f3e4e9;--accent:#d6336c;--chip:#fff0f5;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#fff}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{color:var(--ink);font-family:Nunito,system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid #2a5bff;outline-offset:2px}
.app{height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:10px clamp(12px,3vw,32px)}
.logo{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:22px;color:var(--accent);white-space:nowrap}
.tools{display:flex;gap:8px}
.pill{background:var(--chip);padding:7px 14px;border-radius:99px;font-weight:700;font-size:13px;border:2px solid var(--line);transition:transform .12s}
.pill:hover{transform:scale(1.05)}
.main{display:grid;gap:clamp(8px,2vw,28px);padding:0 clamp(12px,3vw,32px) clamp(10px,2vw,24px);min-height:0;grid-template-rows:minmax(0,38%) minmax(0,1fr)}
@media (min-width:761px){.main{grid-template-columns:minmax(0,1.1fr) minmax(380px,.9fr);grid-template-rows:minmax(0,1fr)}}
.hero{position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
#art{height:100%;width:100%;display:flex;justify-content:center;align-items:center}
#art svg{height:100%;width:auto;max-width:100%;overflow:visible}
.fl{transform-box:fill-box;transform-origin:50% 100%;cursor:pointer}
.fl:hover{animation:wig .6s}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) .35s backwards;transform-box:fill-box;transform-origin:center}
.bye{animation:bye .23s forwards}
.tag{cursor:pointer}
#art{transition:transform .2s ease-out}
.pt{position:fixed;z-index:30;pointer-events:none;font-size:20px;animation:fly .8s ease-out both}
.rain{animation-timing-function:ease-in;font-size:24px}
@keyframes wig{25%{transform:rotate(-7deg) scale(1.06)}60%{transform:rotate(6deg) scale(1.06)}}
@keyframes bye{to{transform:scale(0) rotate(40deg);opacity:0}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.empty{position:absolute;top:4px;left:50%;transform:translateX(-50%);font-family:"Baloo 2",sans-serif;font-weight:700;color:var(--soft);white-space:nowrap;z-index:1}
.panel{border:2px solid var(--line);border-radius:26px;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--panel)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px}
.steps button{padding:8px 2px;border-radius:99px;background:var(--chip);font-family:"Baloo 2",sans-serif;font-weight:700;font-size:15px;color:var(--soft)}
.steps button[aria-selected="true"]{background:var(--accent);color:#fff}
#secs{flex:1;min-height:0;display:flex;flex-direction:column}
.sec{flex:1;min-height:0;display:flex;flex-direction:column;padding:2px 12px 10px}
.sec[hidden]{display:none}
.sec h2{font-family:"Baloo 2",sans-serif;font-size:17px;font-weight:800}
.sec>p{color:var(--soft);font-size:13px;margin-bottom:8px}
@media (max-height:720px){.sec>p{display:none}}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,minmax(0,1fr));gap:8px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;min-height:0;background:var(--chip);border-radius:18px;padding:5px 3px 6px;border:2px solid transparent;text-align:center;transition:border-color .15s}
.card.has{border-color:var(--accent)}
.pick{flex:1;min-height:0;width:100%;display:flex;justify-content:center;transition:transform .15s}
.pick:hover{transform:translateY(-2px) rotate(-3deg)}
.pick:active{transform:scale(.92)}
.pick svg{height:100%;width:auto;max-width:100%}
.card b{font-size:clamp(10px,1.7svh,13px);line-height:1.1}
.card small{color:var(--soft);font-size:clamp(10px,1.6svh,12px)}
.badge{position:absolute;top:3px;right:3px;background:var(--accent);color:#fff;border-radius:99px;padding:1px 8px;font-weight:800;font-size:12px;line-height:1.5}
.badge[hidden]{display:none}
.swrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:5px;border-radius:16px;border:2px solid transparent}
.sw i{display:block;width:44px;height:44px;border-radius:14px;border:2px solid rgba(0,0,0,.08)}
.sw[aria-pressed="true"]{border-color:var(--accent);background:var(--chip)}
.tog{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 14px;background:var(--chip);border-radius:16px;margin-top:6px;font-weight:700;text-align:left}
.tog em{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .2s;flex:none}
.tog em::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog[aria-pressed="true"] em{background:var(--accent)}
.tog[aria-pressed="true"] em::after{transform:translateX(18px)}
label{display:block;font-weight:700;font-size:13px;margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;resize:none}
textarea{font-family:Caveat,cursive;font-size:21px;line-height:1.15;flex:1;min-height:50px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:0}
.count{text-align:right;font-size:12px;color:var(--soft)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-top:2px solid var(--line)}
.foot b{font-family:"Baloo 2",sans-serif;font-size:24px;line-height:1;display:block}
.foot small{color:var(--soft);font-size:13px}
.go{background:#d6336c;color:#fff;padding:11px 24px;border-radius:99px;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:17px;transition:transform .1s}
.go:active{transform:scale(.95)}
.go:disabled{opacity:.45;cursor:not-allowed}
dialog{border:0;border-radius:28px;padding:0;background:var(--panel);color:var(--ink);width:min(92vw,440px);margin:auto;box-shadow:0 24px 70px rgba(74,46,37,.4)}
dialog::backdrop{background:rgba(74,46,37,.45);backdrop-filter:blur(4px)}
dialog[open]{animation:in .25s}
@keyframes in{from{transform:translateY(24px) scale(.96);opacity:0}}
.sheet{padding:22px;position:relative;max-height:92svh;overflow:auto}
.sheet h2{font-family:"Baloo 2",sans-serif;font-size:24px;font-weight:800;line-height:1.1}
.sheet>p{color:var(--soft);margin:4px 0 4px;font-size:14px}
.x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:var(--chip);font-weight:800}
.done{text-align:center}
.done svg{width:min(230px,50vw);display:block;margin:0 auto 4px}
.letter{font-family:Caveat,cursive;font-size:25px;background:#fffdf5;color:#4a2e25;border-radius:14px;padding:10px 16px;margin:10px 0;transform:rotate(-1.5deg);box-shadow:0 3px 0 var(--line)}
.row{display:flex;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.app{max-width:1280px;margin-inline:auto;width:100%}
@media (orientation:landscape) and (min-width:560px) and (max-width:760px){.main{grid-template-columns:minmax(0,1fr) minmax(300px,1fr);grid-template-rows:minmax(0,1fr)}}
@media (max-width:340px){.grid{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,minmax(0,1fr))}}
@media (max-height:480px){.top{padding-block:4px}.steps{padding:6px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="tools">
      <button class="pill" id="shuffle">Surprise me</button>
      <button class="pill" id="clear">Start over</button>
    </div>
  </header>
  <main class="main">
    <section class="hero" aria-label="Your bouquet">
      <p class="empty" id="hint"></p>
      <div id="art"></div>
    </section>
    <section class="panel">
      <div class="steps" role="tablist" id="tabs"></div>
      <div id="secs"></div>
      <div class="foot">
        <div><b id="total">0 stems</b><small id="sub">No flowers yet</small></div>
        <button class="go" id="order" disabled>Send bouquet</button>
      </div>
    </section>
  </main>
</div>

<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const FL=[
{id:'c1',n:'Blush carnation',t:'car',c:'#f6a8c0',d:'#d9578a',p:4},
{id:'c2',n:'Rose carnation',t:'car',c:'#ff5c8a',d:'#c42a62',p:4},
{id:'c3',n:'Red carnation',t:'car',c:'#e5384f',d:'#8f1530',p:4},
{id:'c4',n:'White carnation',t:'car',c:'#fff7f8',d:'#d9a0b6',p:4},
{id:'c5',n:'Sunny carnation',t:'car',c:'#ffd34d',d:'#d99a00',p:4},
{id:'c6',n:'Lilac carnation',t:'car',c:'#c7aaf0',d:'#7a56c4',p:4},
{id:'c7',n:'Peach carnation',t:'car',c:'#ffb48a',d:'#e0743c',p:4},
{id:'k1',n:'Cosmos',t:'cos',c:'#fbd3e1',d:'#9a4a2a',p:3},
{id:'g1',n:'Gerbera',t:'ger',c:'#f2688c',d:'#ffd34d',p:4},
{id:'b1',n:'Buttercup',t:'cup',c:'#ffd23f',d:'#e59a00',p:5},
{id:'l1',n:'Bluebell',t:'bel',c:'#7a8fe0',d:'#fff',p:3},
{id:'l2',n:'Sky bloom',t:'bel',c:'#8fd3f2',d:'#fff',p:3}
];
const PAPER=[{n:'Kraft',c:'#f0cd8e',d:'#e0b574'},{n:'White',c:'#fffafb',d:'#ecd6de'},{n:'Pink',c:'#fbc9da',d:'#f0a6c0'},{n:'Mint',c:'#d4f0e2',d:'#a9dcc3'}];
const RIB=[{n:'Rose',c:'#ff5c8a'},{n:'Coral',c:'#ff8a5c'},{n:'Butter',c:'#f5c63d'},{n:'Sky',c:'#6fb7ee'},{n:'None',c:null}];
const SLOTS=[[200,175,38],[138,200,34],[262,200,34],[200,118,30],[108,250,28],[292,250,28],[152,135,27],[250,138,27],[200,252,32],[88,205,25],[312,208,25],[160,266,26]];
const st={list:[],paper:0,rib:0,green:true,berry:false,msg:'',from:'',last:-1};
const $=i=>document.getElementById(i);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function ring(x,y,n,dist,r,fill,stroke,off){
  let s='';
  for(let i=0;i<n;i++){const a=off+i*Math.PI*2/n;s+=`<circle cx="${x+Math.cos(a)*dist}" cy="${y+Math.sin(a)*dist}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-opacity=".5" stroke-width="1.4"/>`}
  return s;
}
function bloom(f,x,y,r){
  const c=f.c,d=f.d;
  if(f.t==='car'){
    let l='';
    for(let i=0;i<9;i++){const a=i*Math.PI*2/9;l+=`<path d="M${x+Math.cos(a)*r*.3} ${y+Math.sin(a)*r*.3}L${x+Math.cos(a)*r*.55} ${y+Math.sin(a)*r*.55}" stroke="${d}" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round"/>`}
    return ring(x,y,10,r*.64,r*.36,c,d,0)+ring(x,y,7,r*.38,r*.33,c,d,.4)+`<circle cx="${x}" cy="${y}" r="${r*.27}" fill="${c}" stroke="${d}" stroke-opacity=".5" stroke-width="1.4"/>`+l+`<path d="M${x-r*.13} ${y+r*.02}Q${x} ${y-r*.2} ${x+r*.13} ${y+r*.02}" stroke="${d}" fill="none" stroke-width="2" stroke-linecap="round"/>`;
  }
  if(f.t==='cos'){
    let s=`<g transform="translate(${x} ${y})">`;
    for(let i=0;i<5;i++)s+=`<g transform="rotate(${i*72})"><path d="M0 0C${-r*.5} ${-r*.1} ${-r*.5} ${-r*.95} ${-r*.14} ${-r*.98}L0 ${-r*.84}L${r*.14} ${-r*.98}C${r*.5} ${-r*.95} ${r*.5} ${-r*.1} 0 0Z" fill="${c}" stroke="#e3a0b8" stroke-width="1.2"/><path d="M0 ${-r*.25}L0 ${-r*.72}M${-r*.14} ${-r*.3}L${-r*.2} ${-r*.65}M${r*.14} ${-r*.3}L${r*.2} ${-r*.65}" stroke="#fff" stroke-opacity=".7" stroke-width="1.3"/></g>`;
    return s+`<circle r="${r*.17}" fill="${d}"/><circle r="${r*.08}" cx="${-r*.04}" cy="${-r*.04}" fill="#c47a4d"/></g>`;
  }
  if(f.t==='ger'){
    let s=`<g transform="translate(${x} ${y})">`;
    for(let i=0;i<20;i++)s+=`<ellipse rx="${r*.12}" ry="${r*.4}" cy="${-r*.62}" transform="rotate(${i*18})" fill="${c}" stroke="#c93a65" stroke-opacity=".5" stroke-width="1"/>`;
    for(let i=0;i<14;i++)s+=`<path d="M0 ${-r*.4}L0 ${-r*.8}" transform="rotate(${i*25.7})" stroke="#fff" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="3 3"/>`;
    return s+`<circle r="${r*.24}" fill="${d}"/><circle r="${r*.11}" fill="#f5a623"/></g>`;
  }
  if(f.t==='cup'){
    return `<g transform="translate(${x} ${y})"><ellipse cx="${-r*.34}" cy="${-r*.05}" rx="${r*.3}" ry="${r*.55}" transform="rotate(-22 ${-r*.34} ${-r*.05})" fill="${c}" stroke="${d}" stroke-width="1.4"/><ellipse cx="${r*.34}" cy="${-r*.05}" rx="${r*.3}" ry="${r*.55}" transform="rotate(22 ${r*.34} ${-r*.05})" fill="${c}" stroke="${d}" stroke-width="1.4"/><ellipse cy="${-r*.1}" rx="${r*.36}" ry="${r*.62}" fill="${c}" stroke="${d}" stroke-width="1.4"/><path d="M0 ${-r*.55}L0 ${r*.3}M${-r*.18} ${-r*.4}L${-r*.14} ${r*.25}M${r*.18} ${-r*.4}L${r*.14} ${r*.25}" stroke="${d}" stroke-opacity=".6" stroke-width="1.4" fill="none"/><ellipse cy="${r*.58}" rx="${r*.22}" ry="${r*.14}" fill="#4b8a98"/></g>`;
  }
  return ring(x,y,5,r*.5,r*.42,c,'#3a4aa0',-Math.PI/2)+`<circle cx="${x}" cy="${y}" r="${r*.3}" fill="${c}"/><circle cx="${x}" cy="${y}" r="${r*.14}" fill="#fff"/>`;
}
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
function sw(v,x,y,d){
  return calm?'':`<animateTransform attributeName="transform" type="rotate" values="${v.split(';').map(a=>a+' '+x+' '+y).join(';')}" dur="${d}s" repeatCount="indefinite"/>`;
}
function leaf(a,len,fill){
  return `<g transform="translate(200 300) rotate(${a})"><path d="M0 0Q${len*.4} ${-len*.24} ${len} 0Q${len*.4} ${len*.24} 0 0Z" fill="${fill}"/><path d="M6 0L${len*.88} 0M${len*.35} 0L${len*.55} ${-len*.1}M${len*.35} 0L${len*.55} ${len*.1}M${len*.6} 0L${len*.76} ${-len*.07}M${len*.6} 0L${len*.76} ${len*.07}" stroke="#fff" stroke-opacity=".35" stroke-width="2.2" fill="none"/></g>`;
}
function blade(x,tx,ty){
  return `<path d="M${x-6} 310Q${(x+tx)/2-4} ${(310+ty)/2} ${tx} ${ty}Q${(x+tx)/2+6} ${(310+ty)/2} ${x+6} 310Z" fill="#9fd18a"/>`;
}
function sprig(dir,berry){
  const p=[200,300,200+dir*30,190,200+dir*125,135];
  let s=`<path d="M${p[0]} ${p[1]}Q${p[2]} ${p[3]} ${p[4]} ${p[5]}" stroke="#6a9f5a" stroke-width="3" fill="none"/>`;
  for(let k=0;k<6;k++){
    const t=.36+k*.13,u=1-t;
    const x=u*u*p[0]+2*u*t*p[2]+t*t*p[4],y=u*u*p[1]+2*u*t*p[3]+t*t*p[5];
    s+=berry?`<circle cx="${x+dir*6}" cy="${y-4}" r="6" fill="#ff7a95" stroke="#d6336c" stroke-width="1.4"/>`:`<ellipse cx="${x+dir*8}" cy="${y-4}" rx="9" ry="4.5" transform="rotate(${dir*-30} ${x} ${y})" fill="#a8cf8a"/>`;
  }
  return s;
}
function bow(c){
  if(!c)return '';
  return `<g fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M198 414C170 394 126 396 124 412C122 428 168 428 198 416"/><path d="M202 414C230 394 274 396 276 412C278 428 232 428 202 416"/><path d="M196 420C196 446 186 466 168 480C160 486 150 482 152 474"/><path d="M204 420C206 446 218 466 236 480C244 486 254 482 252 474"/><path d="M178 408C190 404 210 404 222 408"/></g><rect x="190" y="406" width="20" height="14" rx="5" fill="${c}"/>`;
}
function tag(){
  return `<g class="tag">${sw('0;7;0;-6;0',296,286,3.4)}<path d="M296 286Q340 262 352 342" stroke="#c9a46a" fill="none" stroke-width="3" stroke-linecap="round"/><g transform="translate(352 344) rotate(30)"><rect x="-6" y="-19" width="86" height="38" rx="8" fill="#ffc9da"/><rect x="-2" y="-15" width="78" height="30" rx="6" fill="none" stroke="#ff7fa5" stroke-width="1.8" stroke-dasharray="4 3"/><circle cx="6" cy="0" r="4" fill="#fff6e6"/><path d="M48 9C32 -1 36 -13 48 -7C60 -13 64 -1 48 9Z" fill="#e8336a"/></g></g>`;
}
function art(){
  const p=PAPER[st.paper],L=st.list;
  let back='';
  if(st.green){
    back+=blade(192,128,30)+blade(204,282,38)+blade(186,76,112)+blade(214,328,92);
    [-172,-150,-128,-106,-84,-62,-40,-16,-178,-2].forEach((a,i)=>{back+=leaf(a,i<8?150+((i*37)%30):105,i%3===1?'#4b8a98':i%2?'#78b36a':'#5c9e5a')});
  }
  if(st.berry)back+=sprig(1,true)+sprig(-1,false);
  let stems='',fl='';
  L.forEach((id,k)=>{const s=SLOTS[k];stems+=`<path d="M${s[0]} ${s[1]}Q${s[0]+(200-s[0])*.4} ${(s[1]+310)/2} 200 310" stroke="${k%3===1?'#4b8a98':'#5c9e5a'}" stroke-width="4" fill="none" stroke-linecap="round"/>`});
  for(let k=L.length-1;k>=0;k--){
    const s=SLOTS[k],f=FL.find(x=>x.id===L[k]);
    fl+=`<g class="fl ${k===st.last||st.all?'pop':''}" data-k="${k}"${st.all?` style="animation-delay:${k*70}ms"`:''}>${bloom(f,s[0],s[1],s[2])}</g>`;
  }
  const paper=`<defs><linearGradient id="pg" x1="0" x2="1"><stop offset="0" stop-color="${p.d}"/><stop offset=".7" stop-color="${p.c}"/></linearGradient></defs><path d="M98 282L204 272L226 470L166 470Z" fill="url(#pg)"/><path d="M204 272L304 282L236 466L214 470Z" fill="${p.c}"/><path d="M204 272L304 282L236 466L214 470Z" fill="#fff" fill-opacity=".28"/><path d="M204 274L226 470" stroke="${p.d}" stroke-width="2" stroke-opacity=".6"/>`;
  return `<svg viewBox="-20 0 450 500" role="img" aria-label="Your bouquet of ${L.length} flowers"><g>${sw('0;1.4;0;-1.4;0',200,470,6)}${back}${stems}${fl}${paper}<g>${sw('0;2.5;0;-2.5;0',200,414,4)}${bow(RIB[st.rib].c)}</g>${tag()}</g></svg>`;
}
function render(){
  $('art').innerHTML=art();
  const n=st.list.length;
  $('total').textContent=n+(n===1?' stem':' stems');
  $('sub').textContent=n?'Wrapped and ready':'No flowers yet';
  $('order').disabled=!n;
  $('hint').textContent=n?'':'Tap a flower to start';
  FL.forEach(f=>{
    const c=st.list.filter(x=>x===f.id).length;
    $('n'+f.id).textContent=c;
    $('m'+f.id).hidden=!c;
    $('card'+f.id).classList.toggle('has',c>0);
  });
  document.querySelectorAll('[data-paper]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.paper===st.paper));
  document.querySelectorAll('[data-rib]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.rib===st.rib));
  $('tgG').setAttribute('aria-pressed',st.green);
  $('tgB').setAttribute('aria-pressed',st.berry);
  st.last=-1;st.all=false;
}
let tt;
function toast(m){
  const t=$('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800);
}
function burst(x,y){
  if(calm)return;
  for(let i=0;i<9;i++){
    const e=document.createElement('span');
    e.className='pt';e.textContent=['🌸','💮','🌷','✿'][i%4];
    const a=Math.random()*6.28,d=40+Math.random()*60;
    e.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-20}px;--r:${Math.random()*360}deg`;
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),900);
  }
}
function rain(){
  if(calm)return;
  for(let i=0;i<28;i++){
    const e=document.createElement('span');
    e.className='pt rain';e.textContent=['🌸','💮','🌷'][i%3];
    e.style.cssText=`left:${Math.random()*100}vw;top:-30px;--dx:${(Math.random()-.5)*160}px;--dy:${innerHeight+60}px;--r:${Math.random()*720}deg;animation-duration:${2+Math.random()*1.6}s;animation-delay:${Math.random()*.8}s`;
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),5000);
  }
}
function add(id,src){
  if(st.list.length>=SLOTS.length){toast('That’s a full bouquet. Remove one to swap.');return}
  st.list.push(id);st.last=st.list.length-1;
  if(src&&!calm){
    const a=$('art').getBoundingClientRect(),tx=a.left+a.width/2,ty=a.top+a.height*.36;
    const sv=src.querySelector('svg'),r=sv.getBoundingClientRect(),c=sv.cloneNode(true);
    Object.assign(c.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',zIndex:20,pointerEvents:'none'});
    document.body.appendChild(c);
    const dx=tx-(r.left+r.width/2),dy=ty-(r.top+r.height/2);
    c.animate([{transform:'translate(0,0) scale(1) rotate(0deg)'},{transform:`translate(${dx*.5}px,${dy*.5-60}px) scale(.9) rotate(120deg)`,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(.5) rotate(300deg)`,opacity:.8}],{duration:520,easing:'ease-in-out'}).onfinish=()=>{c.remove();burst(tx,ty)};
  }
  render();
}
function sub(id){
  const k=st.list.lastIndexOf(id);
  if(k>-1){st.list.splice(k,1);render()}
}

const TABS=['Flowers','Wrap','Ribbon','Note'];
TABS.forEach((t,i)=>{
  const b=document.createElement('button');
  b.role='tab';b.textContent=t;b.id='t'+i;
  b.setAttribute('aria-selected',i===0);
  b.onclick=()=>TABS.forEach((_,j)=>{$('t'+j).setAttribute('aria-selected',j===i);$('s'+j).hidden=j!==i});
  $('tabs').appendChild(b);
  const s=document.createElement('div');
  s.className='sec';s.id='s'+i;s.hidden=i!==0;s.role='tabpanel';
  $('secs').appendChild(s);
});

$('s0').innerHTML='<h2>Choose your flowers</h2><p>Tap to add, tap the count to remove. Up to 12 stems.</p><div class="grid" id="grid"></div>';
FL.forEach(f=>{
  const d=document.createElement('div');
  d.className='card';d.id='card'+f.id;
  d.innerHTML=`<button class="pick" aria-label="Add ${f.n}"><svg viewBox="-48 -48 96 96">${bloom(f,0,0,40)}</svg></button><b>${f.t==='car'?f.n.replace(' carnation',''):f.n.split(' ')[0]}</b><button class="badge" id="m${f.id}" aria-label="Remove one ${f.n}" hidden><span id="n${f.id}">0</span> −</button>`;
  $('grid').appendChild(d);
  d.querySelector('.pick').onclick=e=>add(f.id,e.currentTarget);
  d.querySelector('#m'+f.id).onclick=()=>sub(f.id);
});

$('s1').innerHTML=`<h2>Wrap it up</h2><p>Pick the paper, then add some greenery.</p><div class="swrow">${PAPER.map((p,i)=>`<button class="sw" data-paper="${i}"><i style="background:linear-gradient(135deg,${p.c} 55%,${p.d} 0)"></i>${p.n}</button>`).join('')}</div><button class="tog" id="tgG"><span>Leaves and grass</span><em></em></button><button class="tog" id="tgB"><span>Berries and sprigs</span><em></em></button>`;
$('s2').innerHTML=`<h2>Tie a ribbon</h2><p>A little bow finishes it off.</p><div class="swrow">${RIB.map((r,i)=>`<button class="sw" data-rib="${i}"><i style="background:${r.c||'repeating-linear-gradient(45deg,transparent 0 6px,rgba(0,0,0,.08) 6px 8px)'}"></i>${r.n}</button>`).join('')}</div>`;
$('s3').innerHTML=`<h2>Add a note</h2><p>It hangs from the wrapping on a little heart tag.</p><label for="msg">Your message</label><textarea id="msg" maxlength="120" placeholder="Happy birthday, Mom. Love you!"></textarea><div class="count" id="cnt">0 / 120</div><label for="from">Signed</label><input id="from" maxlength="30" placeholder="Your name" autocomplete="name">`;

document.querySelectorAll('[data-paper]').forEach(b=>b.onclick=()=>{st.paper=+b.dataset.paper;render()});
document.querySelectorAll('[data-rib]').forEach(b=>b.onclick=()=>{st.rib=+b.dataset.rib;render()});
$('tgG').onclick=()=>{st.green=!st.green;render()};
$('tgB').onclick=()=>{st.berry=!st.berry;render()};
$('msg').oninput=e=>{st.msg=e.target.value;$('cnt').textContent=st.msg.length+' / 120'};
$('from').oninput=e=>{st.from=e.target.value};

$('clear').onclick=()=>{st.list=[];st.msg='';$('msg').value='';$('cnt').textContent='0 / 120';render()};
$('shuffle').onclick=()=>{
  const n=7+Math.floor(Math.random()*5);
  st.list=[];
  for(let i=0;i<n;i++)st.list.push(FL[Math.floor(Math.random()*FL.length)].id);
  st.paper=Math.floor(Math.random()*PAPER.length);
  st.rib=Math.floor(Math.random()*(RIB.length-1));
  st.green=true;st.berry=Math.random()>.5;st.all=true;
  render();
  if(!calm)$('art').animate([{transform:'rotate(0)'},{transform:'rotate(-4deg) scale(1.03)'},{transform:'rotate(4deg)'},{transform:'rotate(0)'}],{duration:500});
};

function form(){
  const days=[];
  for(let i=1;i<=5;i++){const d=new Date();d.setDate(d.getDate()+i);days.push(d.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'}))}
  $('sheet').innerHTML=`<button class="x" data-x aria-label="Close">✕</button><h2>Where should it go?</h2><p>${st.list.length} stems, wrapped and ready to send.</p><form id="f"><label for="to">Who’s it for?</label><input id="to" required maxlength="40" placeholder="Recipient’s name" autocomplete="off"><label for="ad">Address</label><input id="ad" required placeholder="House or unit, street, barangay" autocomplete="street-address"><label for="ct">City</label><select id="ct"><option>Quezon City</option><option>Manila</option><option>Makati</option><option>Pasig</option><option>Taguig</option><option>Imus, Cavite</option><option>Other Metro Manila city</option></select><label for="wh">Arrives on</label><select id="wh">${days.map(d=>`<option>${d}</option>`).join('')}</select><div class="row"><button class="go" type="submit">Place order</button></div></form>`;
  $('sheet').querySelector('[data-x]').onclick=()=>$('dlg').close();
  $('f').onsubmit=e=>{
    e.preventDefault();
    const to=esc($('to').value.trim()),wh=$('wh').value;
    $('sheet').innerHTML=`<div class="done"><button class="x" data-x aria-label="Close">✕</button>${art()}<h2>On its way to ${to}!</h2><p>Arrives ${wh}.</p>${st.msg.trim()?`<div class="letter">${esc(st.msg.trim())}${st.from.trim()?`<br>${esc(st.from.trim())}`:''}</div>`:''}<div class="row" style="justify-content:center"><button class="go" id="again">Build another</button></div></div>`;
    $('sheet').querySelector('[data-x]').onclick=()=>$('dlg').close();
    rain();$('again').onclick=()=>{$('dlg').close();$('clear').click()};
  };
}
$('order').onclick=()=>{form();$('dlg').showModal()};
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))$('dlg').close()});

$('art').onclick=e=>{
  if(e.target.closest('.tag')){$('t3').click();$('msg').focus();return}
  const g=e.target.closest('[data-k]');
  if(g){const k=+g.dataset.k;g.classList.add('bye');setTimeout(()=>{st.list.splice(k,1);render()},230)}
};
const hero=document.querySelector('.hero');
if(!calm){
  hero.addEventListener('pointermove',e=>{const r=hero.getBoundingClientRect(),dx=(e.clientX-r.left)/r.width-.5,dy=(e.clientY-r.top)/r.height-.5;$('art').style.transform=`perspective(900px) rotateY(${dx*10}deg) rotateX(${-dy*7}deg)`});
  hero.addEventListener('pointerleave',()=>{$('art').style.transform=''});
}
st.list=['c2','c1','c5','k1','g1','c2','b1','l1','c7'];
render();
</script>
</body>
</html>
