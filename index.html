<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bouquet Builder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&family=Caveat:wght@600&display=swap">
<style>
:root{--bg:#fff;--panel:#fff;--ink:#5b4150;--soft:#7d6575;--line:#f6e4ee;--accent:#f48fb1;--chip:#fff4f8;--pink:#ffc9dc;--lilac:#e6dbff;--mint:#d3f3e6;--butter:#fff0b8;--sky:#d3e9ff;--peach:#ffddc9;color-scheme:light}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#fff}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{color:var(--ink);font-family:Nunito,system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid #7b61ff;outline-offset:2px}
.start{position:fixed;inset:0;overflow:auto;background:#fff;z-index:5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fo{position:absolute;animation:bob 6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px) rotate(7deg)}}
.sx{position:relative;z-index:1;min-height:100%;max-width:1180px;margin:0 auto;padding:clamp(16px,4vw,44px);display:grid;gap:clamp(8px,3vw,40px);align-items:center;grid-template-columns:minmax(0,1fr)}
@media (min-width:861px){.sx{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr)}}
.demo{height:clamp(240px,36svh,380px);display:flex;justify-content:center;order:-1}
@media (min-width:861px){.demo{height:min(74svh,600px);order:0}}
.demo svg{height:100%;width:auto;max-width:100%;overflow:visible}
.demo .fl,.demo .tag{cursor:default}
.kicker{display:inline-block;background:var(--lilac);padding:6px 14px;border-radius:99px;font-weight:800;font-size:13px;margin-bottom:12px}
h1{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(42px,8vw,80px);line-height:.95}
h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--pink) 62% 92%,transparent 92%);padding:0 .1em}
.lead{font-size:clamp(15px,2.2vw,18px);color:var(--soft);max-width:34em;margin:12px 0 18px;line-height:1.5}
.q{font-family:"Baloo 2",sans-serif;font-size:18px;font-weight:700;margin-bottom:8px}
.occ{display:flex;flex-wrap:wrap;gap:8px}
.oc{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;background:var(--oc);border:2px solid transparent;font-weight:800;font-size:14px;transition:transform .12s}
.oc:hover{transform:translateY(-2px)}
.oc[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 3px 0 rgba(91,65,80,.25)}
.occnote{color:var(--soft);font-size:14px;margin:10px 0 16px;min-height:1.4em}
.cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.perks{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;padding:0}
.perks li{padding:6px 12px;border-radius:99px;font-weight:700;font-size:13px;background:var(--mint)}
.perks li:nth-child(2){background:var(--butter)}
.perks li:nth-child(3){background:var(--sky)}
.app{height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px clamp(12px,3vw,32px)}
.lhs{display:flex;align-items:center;gap:10px;flex:none}
.home{display:flex;align-items:center;gap:6px;flex:none}
.logo{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:22px;color:var(--ink);white-space:nowrap}
.tools{display:flex;gap:8px;overflow-x:auto;min-width:0;padding:2px}
.pill{flex:none;background:var(--chip);padding:7px 14px;border-radius:99px;font-weight:800;font-size:13px;border:2px solid var(--line);transition:transform .12s}
.pill:hover:not(:disabled){transform:scale(1.05)}
.pill:disabled{opacity:.45;cursor:not-allowed}
.pill.big{padding:11px 22px;font-size:15px;background:var(--lilac);border-color:transparent}
.main{display:grid;gap:clamp(8px,2vw,28px);padding:0 clamp(12px,3vw,32px) clamp(10px,2vw,24px);min-height:0;grid-template-rows:minmax(0,38%) minmax(0,1fr)}
@media (min-width:761px){.main{grid-template-columns:minmax(0,1.1fr) minmax(380px,.9fr);grid-template-rows:minmax(0,1fr)}}
.hero{position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
#art{height:100%;width:100%;display:flex;justify-content:center;align-items:center;transition:transform .2s ease-out}
#art svg{height:100%;width:auto;max-width:100%;overflow:visible}
.fl{transform-box:fill-box;transform-origin:50% 100%;cursor:pointer}
.fl:hover{animation:wig .6s}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) .35s backwards;transform-box:fill-box;transform-origin:center}
.bye{animation:bye .23s forwards}
.tag{cursor:pointer}
.pt{position:fixed;z-index:30;pointer-events:none;font-size:20px;animation:fly .8s ease-out both}
.rain{animation-timing-function:ease-in;font-size:24px}
@keyframes wig{25%{transform:rotate(-7deg) scale(1.06)}60%{transform:rotate(6deg) scale(1.06)}}
@keyframes bye{to{transform:scale(0) rotate(40deg);opacity:0}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.empty{position:absolute;top:4px;left:50%;transform:translateX(-50%);font-family:"Baloo 2",sans-serif;font-weight:700;color:var(--soft);white-space:nowrap;z-index:1}
.panel{border:2px solid var(--line);border-radius:26px;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--panel)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:10px}
.steps button{padding:8px 0;border-radius:99px;background:var(--chip);font-family:"Baloo 2",sans-serif;font-weight:700;font-size:clamp(12px,3.4vw,15px);color:var(--soft)}
.steps button[aria-selected="true"]{background:var(--pink);color:var(--ink)}
#secs{flex:1;min-height:0;display:flex;flex-direction:column}
.sec{flex:1;min-height:0;display:flex;flex-direction:column;padding:2px 12px 10px;overflow:auto}
#s0{overflow:hidden}
.sec h2{font-family:"Baloo 2",sans-serif;font-size:17px;font-weight:800}
.sec>p{color:var(--soft);font-size:13px;margin-bottom:8px}
.sec .swrow+h2{margin-top:10px}
@media (max-height:720px){.sec>p{display:none}}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;flex:none}
.chip{flex:none;padding:5px 12px;border-radius:99px;background:var(--chip);font-weight:800;font-size:12px;border:2px solid transparent}
.chip[aria-pressed="true"]{background:var(--lilac);border-color:#c9b6f0}
.grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));grid-auto-rows:98px;align-content:start;gap:8px;padding:2px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;min-height:0;background:var(--chip);border-radius:18px;padding:5px 3px 6px;border:2px solid transparent;text-align:center;transition:border-color .15s}
.card.has{border-color:var(--accent)}
.pick{flex:1;min-height:0;width:100%;display:flex;justify-content:center;transition:transform .15s}
.pick:hover{transform:translateY(-2px) rotate(-3deg)}
.pick:active{transform:scale(.92)}
.pick svg{height:100%;width:auto;max-width:100%}
.card b{font-size:11px;line-height:1.1}
.card small{color:var(--soft);font-size:10px;font-weight:700}
.badge{position:absolute;top:3px;right:3px;background:var(--pink);color:var(--ink);border:1.5px solid var(--accent);border-radius:99px;padding:0 7px;font-weight:800;font-size:12px;line-height:1.5}
.swrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:5px;border-radius:16px;border:2px solid transparent}
.sw i{display:block;width:44px;height:44px;border-radius:14px;border:2px solid rgba(0,0,0,.08)}
.sw[aria-pressed="true"],.cb[aria-pressed="true"]{border-color:var(--accent);background:var(--chip)}
.cb{display:flex;flex-direction:column;align-items:center;gap:1px;width:94px;padding:6px;border-radius:16px;border:2px solid transparent;font-size:12px;font-weight:800}
.cb svg{width:100%;height:46px}
.cb small{color:var(--soft);font-weight:700;font-size:11px}
.tog{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 14px;background:var(--chip);border-radius:16px;margin-top:6px;font-weight:700;text-align:left}
.tog small{color:var(--soft);margin-left:6px;font-weight:700}
.tog em{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .2s;flex:none}
.tog em::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog[aria-pressed="true"] em{background:#f7a1c0}
.tog[aria-pressed="true"] em::after{transform:translateX(18px)}
label{display:block;font-weight:700;font-size:13px;margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;resize:none}
textarea{font-family:Caveat,cursive;font-size:21px;line-height:1.15;flex:1;min-height:60px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:0}
.count{text-align:right;font-size:12px;color:var(--soft)}
.nchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.nc{padding:5px 10px;border-radius:12px;background:var(--mint);font-size:12px;font-weight:700;text-align:left}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-top:2px solid var(--line)}
.foot b{font-family:"Baloo 2",sans-serif;font-size:24px;line-height:1;display:block}
.foot small{color:var(--soft);font-size:13px;font-weight:700}
.go{background:var(--pink);color:var(--ink);padding:11px 24px;border-radius:99px;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:17px;box-shadow:0 4px 0 #f3a6c3;transition:transform .1s,box-shadow .1s}
.go:hover:not(:disabled){transform:translateY(-1px)}
.go:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #f3a6c3}
.go:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
dialog{border:0;border-radius:28px;padding:0;background:var(--panel);color:var(--ink);width:min(92vw,440px);margin:auto;box-shadow:0 24px 70px rgba(91,65,80,.3)}
dialog::backdrop{background:rgba(91,65,80,.35);backdrop-filter:blur(4px)}
dialog[open]{animation:in .25s}
@keyframes in{from{transform:translateY(24px) scale(.96);opacity:0}}
.sheet{padding:22px;position:relative;max-height:92svh;overflow:auto}
.sheet h2{font-family:"Baloo 2",sans-serif;font-size:24px;font-weight:800;line-height:1.1}
.sheet>p{color:var(--soft);margin:4px 0;font-size:14px}
.x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:var(--chip);font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details{margin-top:12px;background:var(--chip);border-radius:14px;padding:8px 12px}
summary{font-weight:800;cursor:pointer}
.ln{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0}
.tot{display:flex;justify-content:space-between;font-family:"Baloo 2",sans-serif;font-size:20px;font-weight:800;margin-top:12px}
.done{text-align:center}
.done svg{width:min(230px,50vw);display:block;margin:0 auto 4px}
.meta{font-weight:800}
.letter{font-family:Caveat,cursive;font-size:25px;background:#fffdf5;color:var(--ink);border-radius:14px;padding:10px 16px;margin:10px 0;transform:rotate(-1.5deg);box-shadow:0 3px 0 var(--line)}
.row{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.app{max-width:1280px;margin-inline:auto;width:100%}
@media (orientation:landscape) and (min-width:560px) and (max-width:760px){.main{grid-template-columns:minmax(0,1fr) minmax(300px,1fr);grid-template-rows:minmax(0,1fr)}}
@media (max-width:520px){.logo,.home{display:none}.pill{padding:6px 10px;font-size:12px}}
@media (max-height:480px){.top{padding-block:4px}.steps{padding:6px}}
</style>
</head>
<body>
<section class="start" id="start" aria-label="Welcome">
  <div class="floaters" id="floaters" aria-hidden="true"></div>
  <div class="sx">
    <div class="copy">
      <p class="kicker">Hand-picked. Hand-tied. Hand-delivered.</p>
      <h1>Bouquet <em>Builder</em></h1>
      <p class="lead">Pick your blooms, choose a pretty wrap, tuck in a note, and send a little joy to someone you love.</p>
      <h2 class="q">What are we celebrating?</h2>
      <div class="occ" id="occ" role="group" aria-label="Occasion"></div>
      <p class="occnote" id="occnote" aria-live="polite"></p>
      <div class="cta">
        <button class="go" id="begin">Start building</button>
        <button class="pill big" id="startSurprise">Surprise me</button>
        <button class="pill big" id="resume" hidden>Continue my bouquet</button>
      </div>
      <ul class="perks"><li>30 flowers</li><li>5 ways to wrap</li><li>Delivery across Metro Manila</li></ul>
    </div>
    <div class="demo" id="demo" role="img" aria-label="A sample bouquet"></div>
  </div>
</section>
<div class="app" id="app" hidden>
  <header class="top">
    <div class="lhs"><button class="pill" id="back">← Back</button><button class="home" id="home" aria-label="Back to start"><span class="logo">Bouquet Builder</span></button></div>
    <div class="tools">
      <button class="pill" id="undo" disabled>Undo</button>
      <button class="pill" id="shuffle">Surprise me</button>
      <button class="pill" id="clear">Reset</button>
      <button class="pill" id="save">Save</button>
    </div>
  </header>
  <main class="main">
    <section class="hero" aria-label="Your bouquet">
      <p class="empty" id="hint"></p>
      <div id="art"></div>
    </section>
    <section class="panel">
      <div class="steps" role="tablist" id="tabs"></div>
      <div id="secs"></div>
      <div class="foot">
        <div><b id="total">0 stems</b><small id="sub">No flowers yet</small></div>
        <button class="go" id="order" disabled>Send bouquet</button>
      </div>
    </section>
  </main>
</div>

<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const FL=[

const CONT=[{n:'Paper wrap',p:80},{n:'Basket',p:220},{n:'Vase',p:180},{n:'Jar',p:120},{n:'Teacup',p:160}];
const CONF=[{y:414,s:1,t:[0,0]},{y:352,s:.72,t:[8,8]},{y:352,s:.55,t:[-46,44]},{y:352,s:.6,t:[-22,46]},{y:368,s:.58,t:[0,0]}];

function art(s){
  s=s||st;
  const p=PAPER[s.paper],L=s.list,cf=CONF[s.cont],cc=cont(s.cont,p);
  let back='';
  if(s.green){
    back+=blade(192,128,30)+blade(204,282,38)+blade(186,76,112)+blade(214,328,92);
    [-172,-150,-128,-106,-84,-62,-40,-16,-178,-2].forEach((a,i)=>{back+=leaf(a,i<8?150+((i*37)%30):105,i%3===1?'#4b8a98':i%2?'#78b36a':'#5c9e5a')});
  }
  if(s.berry)back+=sprig(1,true)+sprig(-1,false);
  if(s.fill)back+=filler();
  back+=cc[0];
  let stems='',fl='';
  L.forEach((id,k)=>{const q=SLOTS[k];stems+=`<path d="M${q[0]} ${q[1]}Q${q[0]+(200-q[0])*.4} ${(q[1]+310)/2} 200 310" stroke="${k%3===1?'#4b8a98':'#5c9e5a'}" stroke-width="4" fill="none" stroke-linecap="round"/>`});
  for(let k=L.length-1;k>=0;k--){
    const q=SLOTS[k],f=FM[L[k]];
    fl+=`<g class="fl ${k===s.last||s.all?'pop':''}" data-k="${k}"${s.all?` style="animation-delay:${k*70}ms"`:''}>${bloom(f,q[0],q[1],q[2])}</g>`;
  }
  let top='';
  if(s.bfly)top+=bf(60,120,'#e6dbff','#9d7be8','M0 0C14 -18 30 -18 44 0C30 16 14 16 0 0',7)+bf(344,84,'#d3f3e6','#4fb58b','M0 0C-14 -16 -30 -16 -44 0C-30 18 -14 18 0 0',6);
  if(s.spark)top+=sparkles();
  const bowAt=`<g transform="translate(200 ${cf.y}) scale(${cf.s}) translate(-200 -414)"><g>${sw('0;2.5;0;-2.5;0',200,414,4)}${bow(RIB[s.rib].c)}</g></g>`;
  return `<svg viewBox="-20 0 450 500" role="img" aria-label="Your bouquet of ${L.length} flowers"><g>${sw('0;1.4;0;-1.4;0',200,470,6)}${back}${stems}${fl}${cc[1]}${bowAt}${tag(TAGS[s.tag||0],cf.t)}${top}</g></svg>`;
}

function pack(){const{list,paper,cont,rib,green,berry,fill,bfly,spark,tag}=st;return{list,paper,cont,rib,green,berry,fill,bfly,spark,tag}}
function keep(){hist.push(JSON.stringify(pack()));if(hist.length>40)hist.shift()}
function mut(fn){keep();fn();render()}
function persist(){try{localStorage.setItem('bb2',JSON.stringify({...pack(),msg:st.msg,from:st.from,occ:st.occ}))}catch(e){}}
function restore(){
  try{
    const j=JSON.parse(localStorage.getItem('bb2')||'null');
    if(!j||!Array.isArray(j.list))return;
    const ok=(v,a)=>Number.isInteger(v)&&v>=0&&v<a.length;
    st.list=j.list.filter(id=>FM[id]).slice(0,MAX);
    if(ok(j.paper,PAPER))st.paper=j.paper;
    if(ok(j.cont,CONT))st.cont=j.cont;
    if(ok(j.rib,RIB))st.rib=j.rib;
    if(ok(j.tag,TAGS))st.tag=j.tag;
    ['green','berry','fill','bfly','spark'].forEach(k=>{st[k]=!!j[k]});
    st.msg=String(j.msg||'').slice(0,120);st.from=String(j.from||'').slice(0,30);
  }catch(e){}
}
function lines(){
  const out=[],c={};
  st.list.forEach(id=>{c[id]=(c[id]||0)+1});
  Object.keys(c).forEach(id=>out.push([c[id]+' × '+FM[id].n,c[id]*FM[id].p]));
  out.push([CONT[st.cont].n,CONT[st.cont].p]);
  if(RIB[st.rib].c)out.push(['Ribbon',15]);
  EXTRAS.forEach(e=>{if(st[e.k]&&e.p)out.push([e.n,e.p])});
  return out;
}
const sum=a=>a.reduce((t,l)=>t+l[1],0);

let tt;

function burst(x,y){
  if(calm)return;
  for(let i=0;i<9;i++){
    const e=document.createElement('span');
    e.className='pt';e.textContent=['🌸','💮','🌷','✿'][i%4];
    const a=Math.random()*6.28,d=40+Math.random()*60;
    e.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-20}px;--r:${Math.random()*360}deg`;
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),900);
  }
}
function rain(){
  if(calm)return;
  for(let i=0;i<28;i++){
    const e=document.createElement('span');
    e.className='pt rain';e.textContent=['🌸','💮','🌷'][i%3];
    e.style.cssText=`left:${Math.random()*100}vw;top:-30px;--dx:${(Math.random()-.5)*160}px;--dy:${innerHeight+60}px;--r:${Math.random()*720}deg;animation-duration:${2+Math.random()*1.6}s;animation-delay:${Math.random()*.8}s`;
    document.body.appendChild(e);

  }
}
function add(id,src){
  if(st.list.length>=MAX){toast('That’s a full bouquet. Remove one to swap.');return}
  keep();
  st.list.push(id);st.last=st.list.length-1;
  if(src&&!calm){
    const a=$('art').getBoundingClientRect(),tx=a.left+a.width/2,ty=a.top+a.height*.36;
    const sv=src.querySelector('svg'),r=sv.getBoundingClientRect(),c=sv.cloneNode(true);
    Object.assign(c.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',zIndex:20,pointerEvents:'none'});
    document.body.appendChild(c);
    const dx=tx-(r.left+r.width/2),dy=ty-(r.top+r.height/2);
    c.animate([{transform:'translate(0,0) scale(1) rotate(0deg)'},{transform:`translate(${dx*.5}px,${dy*.5-60}px) scale(.9) rotate(120deg)`,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(.5) rotate(300deg)`,opacity:.8}],{duration:520,easing:'ease-in-out'}).onfinish=()=>{c.remove();burst(tx,ty)};
  }
  render();
}

function surprise(){

$('order').onclick=()=>{form();$('dlg').showModal()};
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))$('dlg').close()});

$('art').onclick=e=>{
  if(e.target.closest('.tag')){$('t4').click();$('msg').focus();return}
  const g=e.target.closest('[data-k]');
  if(g){const k=+g.dataset.k;g.classList.add('bye');setTimeout(()=>{keep();st.list.splice(k,1);render()},230)}
};
const hero=document.querySelector('.hero');
if(!calm){
  hero.addEventListener('pointermove',e=>{const r=hero.getBoundingClientRect(),dx=(e.clientX-r.left)/r.width-.5,dy=(e.clientY-r.top)/r.height-.5;$('art').style.transform=`perspective(900px) rotateY(${dx*10}deg) rotateX(${-dy*7}deg)`});
  hero.addEventListener('pointerleave',()=>{$('art').style.transform=''});
}

const dBase={list:['r1','p1','c1','k1','w1','t1','r3','v1','d1','h2','c6','y1','g1','a1'],green:true,berry:false,fill:true,bfly:true,spark:true,tag:0};
const dPaper=[2,0,6,3,4],dRib=[0,2,4,5,1];
const DEMOS=[0,1,2,3,4].map(i=>({...dBase,cont:i,paper:dPaper[i],rib:dRib[i]}));
let demoT,di=0,pick=-1;
function demo(){$('demo').innerHTML=art(DEMOS[di%DEMOS.length])}
function showStart(){
  $('app').hidden=true;$('start').hidden=false;
  $('resume').hidden=!st.list.length;
  demo();clearInterval(demoT);
  if(!calm)demoT=setInterval(()=>{di++;demo()},4200);
}
function showApp(){
  clearInterval(demoT);
  $('start').hidden=true;$('app').hidden=false;
  $('msg').value=st.msg;$('from').value=st.from;$('cnt').textContent=st.msg.length+' / 120';
  notes();render();
}
function setNote(){
  $('occnote').textContent=pick>-1?OCC[pick].blurb:'Pick an occasion for a head start, or begin from scratch.';
  document.querySelectorAll('.oc').forEach((b,i)=>b.setAttribute('aria-pressed',i===pick));
}
OCC.forEach((o,i)=>{
  const b=document.createElement('button');
  b.className='oc';b.style.setProperty('--oc',o.bg);
  b.innerHTML=`<span aria-hidden="true">${o.e}</span>${o.n}`;
  b.onclick=()=>{pick=pick===i?-1:i;setNote()};
  $('occ').appendChild(b);
});
$('begin').onclick=()=>{hist.length=0;if(pick>-1)applyOcc(pick);else fresh();showApp()};
$('startSurprise').onclick=()=>{hist.length=0;fresh();surprise();showApp()};
$('resume').onclick=()=>{$('t0').click();showApp()};

  const e=document.createElement('div');
  e.className='fo';e.style.cssText=`left:${q[0]}%;top:${q[1]}%;width:${q[3]}px;height:${q[3]}px;animation-delay:${-i*.8}s`;
  e.innerHTML=`<svg viewBox="-48 -48 96 96" width="100%" height="100%">${bloom(FM[q[2]],0,0,40)}</svg>`;
  $('floaters').appendChild(e);
});
restore();
setNote();
showStart();
</script>
</body>
